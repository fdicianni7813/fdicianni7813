<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="pt pd">
  <title id="pt">One retail dataset analysed with Python, SQL and Power BI</title>
  <desc id="pd">A dataset of 1,000 retail transactions flowing into three branches: Python with Pandas, Streamlit and Plotly; SQL with SQLite, CTEs and views; Power BI with DAX, Power Query and a star schema.</desc>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10273d"/>
    </linearGradient>
    <clipPath id="pcard"><rect width="900" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    .wire { fill: none; stroke: #ffffff; stroke-opacity: .13; stroke-width: 2; }
    .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 5 17;
            animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    .f2 { animation-delay: -.53s; } .f3 { animation-delay: -1.06s; }

    .node { opacity: 0; animation: pop .7s cubic-bezier(.2,.9,.3,1.2) forwards; }
    .n0 { animation-delay: .05s; } .n1 { animation-delay: .5s; }
    .n2 { animation-delay: .68s; } .n3 { animation-delay: .86s; }
    @keyframes pop { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }

    .beat { transform-box: fill-box; transform-origin: center; animation: beat 2.6s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .flow, .node, .beat { animation: none; }
      .node { opacity: 1; }
      .flow { stroke-dasharray: none; stroke-opacity: .55; }
    }
  </style>

  <g clip-path="url(#pcard)">
    <rect width="900" height="300" fill="url(#pbg)"/>

    <!-- wires -->
    <path class="wire" d="M212 150 C 340 150, 400 62, 556 62"/>
    <path class="wire" d="M212 150 L 556 150"/>
    <path class="wire" d="M212 150 C 340 150, 400 238, 556 238"/>

    <path class="flow"    d="M212 150 C 340 150, 400 62, 556 62"  stroke="#38bdf8"/>
    <path class="flow f2" d="M212 150 L 556 150"                  stroke="#2dd4bf"/>
    <path class="flow f3" d="M212 150 C 340 150, 400 238, 556 238" stroke="#f2c811"/>

    <!-- source -->
    <g class="node n0">
      <g class="beat">
        <rect x="40" y="98" width="172" height="104" rx="14" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".45"/>
      </g>
      <g fill="#9bdcf5" opacity=".9">
        <ellipse cx="68" cy="126" rx="12" ry="4.5" fill="none" stroke="#9bdcf5" stroke-width="1.6"/>
        <path d="M56 126 v14 a12 4.5 0 0 0 24 0 v-14" fill="none" stroke="#9bdcf5" stroke-width="1.6"/>
      </g>
      <text class="mono" x="90" y="131" font-size="12" fill="#9bdcf5" letter-spacing="1.4">RAW DATA</text>
      <text x="58" y="166" font-size="24" font-weight="700" fill="#ffffff">1,000</text>
      <text x="58" y="186" font-size="13" fill="#8fa3b8">transactions · retail F&amp;B</text>
    </g>

    <!-- branch 1: python -->
    <g class="node n1">
      <rect x="556" y="24" width="304" height="76" rx="12" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".45"/>
      <circle cx="580" cy="62" r="6" fill="#38bdf8"/>
      <text x="600" y="57" font-size="17" font-weight="700" fill="#9bdcf5">Python</text>
      <text class="mono" x="600" y="78" font-size="12" fill="#8fa3b8">Pandas · Streamlit · Plotly</text>
    </g>

    <!-- branch 2: sql -->
    <g class="node n2">
      <rect x="556" y="112" width="304" height="76" rx="12" fill="#2dd4bf" fill-opacity=".08" stroke="#2dd4bf" stroke-opacity=".45"/>
      <circle cx="580" cy="150" r="6" fill="#2dd4bf"/>
      <text x="600" y="145" font-size="17" font-weight="700" fill="#99f0e2">SQL</text>
      <text class="mono" x="600" y="166" font-size="12" fill="#8fa3b8">SQLite · CTEs · Views</text>
    </g>

    <!-- branch 3: power bi -->
    <g class="node n3">
      <rect x="556" y="200" width="304" height="76" rx="12" fill="#f2c811" fill-opacity=".08" stroke="#f2c811" stroke-opacity=".45"/>
      <circle cx="580" cy="238" r="6" fill="#f2c811"/>
      <text x="600" y="233" font-size="17" font-weight="700" fill="#f7de6e">Power BI</text>
      <text class="mono" x="600" y="254" font-size="12" fill="#8fa3b8">DAX · Power Query · Star schema</text>
    </g>
  </g>
</svg>
