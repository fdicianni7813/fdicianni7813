<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="st sd">
  <title id="st">Technologies and tools</title>
  <desc id="sd">Data and analysis: Python, Pandas, NumPy, SQL, SQLite, Excel. Visualization and BI: Power BI, DAX, Power Query, Streamlit, Plotly, Matplotlib. Workflow: Git, GitHub, Jupyter, VS Code.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10273d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5"  stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scard"><rect width="900" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .lbl { font-size: 11px; letter-spacing: 2px; fill: #5b7083; }

    .p { opacity: 0; animation: rise .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .p { transform-box: fill-box; transform-origin: center; }

    .r { opacity: 0; animation: fadein .5s ease-out forwards; }
    @keyframes fadein { to { opacity: 1; } }

    .sheen { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-420px); } 55%, 100% { transform: translateX(980px); } }

    @media (prefers-reduced-motion: reduce) {
      .p, .r, .sheen { animation: none; opacity: 1; }
      .sheen { opacity: 0; }
    }
  </style>

  <g clip-path="url(#scard)">
    <rect width="900" height="250" fill="url(#sbg)"/>

    <!-- row 1 -->
    <text class="mono lbl r" x="450" y="30" text-anchor="middle" style="animation-delay:.05s">DATA &amp; ANALYSIS</text>
    <g class="mono" font-size="13" text-anchor="middle">
      <g class="p" style="animation-delay:.10s"><rect x="226" y="42" width="73"  height="30" rx="15" fill="#6ab0e8" fill-opacity=".12" stroke="#6ab0e8" stroke-opacity=".5"/><text x="262.5" y="62" fill="#6ab0e8">Python</text></g>
      <g class="p" style="animation-delay:.16s"><rect x="309" y="42" width="73"  height="30" rx="15" fill="#e86fc0" fill-opacity=".12" stroke="#e86fc0" stroke-opacity=".5"/><text x="345.5" y="62" fill="#e86fc0">Pandas</text></g>
      <g class="p" style="animation-delay:.22s"><rect x="392" y="42" width="65"  height="30" rx="15" fill="#4dabcf" fill-opacity=".12" stroke="#4dabcf" stroke-opacity=".5"/><text x="424.5" y="62" fill="#4dabcf">NumPy</text></g>
      <g class="p" style="animation-delay:.28s"><rect x="467" y="42" width="49"  height="30" rx="15" fill="#7fb3d5" fill-opacity=".12" stroke="#7fb3d5" stroke-opacity=".5"/><text x="491.5" y="62" fill="#7fb3d5">SQL</text></g>
      <g class="p" style="animation-delay:.34s"><rect x="526" y="42" width="73"  height="30" rx="15" fill="#62c6e8" fill-opacity=".12" stroke="#62c6e8" stroke-opacity=".5"/><text x="562.5" y="62" fill="#62c6e8">SQLite</text></g>
      <g class="p" style="animation-delay:.40s"><rect x="609" y="42" width="65"  height="30" rx="15" fill="#4ec98a" fill-opacity=".12" stroke="#4ec98a" stroke-opacity=".5"/><text x="641.5" y="62" fill="#4ec98a">Excel</text></g>
    </g>

    <!-- row 2 -->
    <text class="mono lbl r" x="450" y="106" text-anchor="middle" style="animation-delay:.42s">VISUALIZATION &amp; BI</text>
    <g class="mono" font-size="13" text-anchor="middle">
      <g class="p" style="animation-delay:.46s"><rect x="164" y="118" width="88"  height="30" rx="15" fill="#f2c811" fill-opacity=".12" stroke="#f2c811" stroke-opacity=".5"/><text x="208" y="138" fill="#f7de6e">Power BI</text></g>
      <g class="p" style="animation-delay:.52s"><rect x="262" y="118" width="49"  height="30" rx="15" fill="#f0b429" fill-opacity=".12" stroke="#f0b429" stroke-opacity=".5"/><text x="286.5" y="138" fill="#f0b429">DAX</text></g>
      <g class="p" style="animation-delay:.58s"><rect x="321" y="118" width="112" height="30" rx="15" fill="#b07fd6" fill-opacity=".12" stroke="#b07fd6" stroke-opacity=".5"/><text x="377" y="138" fill="#b07fd6">Power Query</text></g>
      <g class="p" style="animation-delay:.64s"><rect x="443" y="118" width="96"  height="30" rx="15" fill="#ff6b6b" fill-opacity=".12" stroke="#ff6b6b" stroke-opacity=".5"/><text x="491" y="138" fill="#ff6b6b">Streamlit</text></g>
      <g class="p" style="animation-delay:.70s"><rect x="549" y="118" width="73"  height="30" rx="15" fill="#8aa4d6" fill-opacity=".12" stroke="#8aa4d6" stroke-opacity=".5"/><text x="585.5" y="138" fill="#8aa4d6">Plotly</text></g>
      <g class="p" style="animation-delay:.76s"><rect x="632" y="118" width="104" height="30" rx="15" fill="#5fa8d3" fill-opacity=".12" stroke="#5fa8d3" stroke-opacity=".5"/><text x="684" y="138" fill="#5fa8d3">Matplotlib</text></g>
    </g>

    <!-- row 3 -->
    <text class="mono lbl r" x="450" y="182" text-anchor="middle" style="animation-delay:.78s">WORKFLOW</text>
    <g class="mono" font-size="13" text-anchor="middle">
      <g class="p" style="animation-delay:.82s"><rect x="293" y="194" width="49" height="30" rx="15" fill="#f0764b" fill-opacity=".12" stroke="#f0764b" stroke-opacity=".5"/><text x="317.5" y="214" fill="#f0764b">Git</text></g>
      <g class="p" style="animation-delay:.88s"><rect x="352" y="194" width="73" height="30" rx="15" fill="#d0d7de" fill-opacity=".12" stroke="#d0d7de" stroke-opacity=".5"/><text x="388.5" y="214" fill="#d0d7de">GitHub</text></g>
      <g class="p" style="animation-delay:.94s"><rect x="435" y="194" width="81" height="30" rx="15" fill="#f59b4a" fill-opacity=".12" stroke="#f59b4a" stroke-opacity=".5"/><text x="475.5" y="214" fill="#f59b4a">Jupyter</text></g>
      <g class="p" style="animation-delay:1.0s"><rect x="526" y="194" width="81" height="30" rx="15" fill="#4aa3f0" fill-opacity=".12" stroke="#4aa3f0" stroke-opacity=".5"/><text x="566.5" y="214" fill="#4aa3f0">VS Code</text></g>
    </g>

    <!-- shimmer sweep -->
    <rect class="sheen" x="-200" y="0" width="200" height="250" fill="url(#sheen)"/>
  </g>
</svg>
