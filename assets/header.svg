<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d">
  <title id="t">Francesco Di Cianni — Data Analytics and Business Intelligence</title>
  <desc id="d">Animated banner with a bar chart growing and a trend line being drawn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10273d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9bdcf5"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

    .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: grow 9s cubic-bezier(.2,.8,.2,1) infinite; }
    .b1 { animation-delay: 0s; }   .b2 { animation-delay: .12s; } .b3 { animation-delay: .24s; }
    .b4 { animation-delay: .36s; } .b5 { animation-delay: .48s; } .b6 { animation-delay: .6s; }
    .b7 { animation-delay: .72s; }
    @keyframes grow { 0% { transform: scaleY(0); } 14% { transform: scaleY(1); } 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } }

    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 9s ease-in-out infinite; }
    @keyframes draw { 0%, 14% { stroke-dashoffset: 1; opacity: 1; } 38% { stroke-dashoffset: 0; opacity: 1; } 90% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }

    .dot { opacity: 0; animation: dot 9s ease-in-out infinite; }
    @keyframes dot { 0%, 36% { opacity: 0; } 42%, 90% { opacity: 1; } 100% { opacity: 0; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ping 1.8s ease-out infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(3.2); opacity: 0; } }

    .fade { opacity: 0; animation: in .8s ease-out forwards; }
    .f1 { animation-delay: .1s; } .f2 { animation-delay: .35s; } .f3 { animation-delay: .6s; }
    .f4 { animation-delay: .9s; } .f5 { animation-delay: 1.1s; } .f6 { animation-delay: 1.3s; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .bar, .line, .dot, .ring, .fade, .cursor { animation: none; }
      .line { stroke-dashoffset: 0; } .dot, .fade { opacity: 1; } .ring { opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- chart grid -->
    <g stroke="#ffffff" stroke-opacity=".07" stroke-width="1">
      <line x1="548" y1="75"  x2="864" y2="75"/>
      <line x1="548" y1="118" x2="864" y2="118"/>
      <line x1="548" y1="161" x2="864" y2="161"/>
    </g>
    <line x1="548" y1="205" x2="864" y2="205" stroke="#ffffff" stroke-opacity=".22" stroke-width="1"/>

    <!-- bars -->
    <g fill="url(#bar)">
      <rect class="bar b1" x="560" y="155" width="28" height="50"  rx="4"/>
      <rect class="bar b2" x="604" y="133" width="28" height="72"  rx="4"/>
      <rect class="bar b3" x="648" y="145" width="28" height="60"  rx="4"/>
      <rect class="bar b4" x="692" y="113" width="28" height="92"  rx="4"/>
      <rect class="bar b5" x="736" y="125" width="28" height="80"  rx="4"/>
      <rect class="bar b6" x="780" y="93"  width="28" height="112" rx="4"/>
      <rect class="bar b7" x="824" y="75"  width="28" height="130" rx="4"/>
    </g>

    <!-- trend line -->
    <path class="line" pathLength="1" d="M574 137 L618 115 L662 127 L706 95 L750 107 L794 75 L838 55"
          fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="dot">
      <circle class="ring" cx="838" cy="55" r="5" fill="#f2c811"/>
      <circle cx="838" cy="55" r="5" fill="#f2c811"/>
    </g>

    <!-- text -->
    <text class="mono fade f1" x="48" y="72" font-size="14" fill="#2dd4bf" letter-spacing="1.5">DATA ANALYTICS · BUSINESS INTELLIGENCE</text>
    <text class="fade f2" x="46" y="124" font-size="42" font-weight="700" fill="url(#name)">Francesco Di Cianni</text>
    <text class="fade f3" x="48" y="158" font-size="17" fill="#c9d6e2">From raw data to dashboards that answer business questions<tspan class="cursor" fill="#2dd4bf"> _</tspan></text>

    <!-- stack pills -->
    <g class="mono" font-size="13" text-anchor="middle">
      <g class="fade f4">
        <rect x="48" y="186" width="84" height="30" rx="15" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".55"/>
        <text x="90" y="206" fill="#9bdcf5">Python</text>
      </g>
      <text class="fade f4" x="146" y="206" fill="#5b7083">→</text>
      <g class="fade f5">
        <rect x="160" y="186" width="64" height="30" rx="15" fill="#2dd4bf" fill-opacity=".12" stroke="#2dd4bf" stroke-opacity=".55"/>
        <text x="192" y="206" fill="#99f0e2">SQL</text>
      </g>
      <text class="fade f5" x="238" y="206" fill="#5b7083">→</text>
      <g class="fade f6">
        <rect x="252" y="186" width="98" height="30" rx="15" fill="#f2c811" fill-opacity=".12" stroke="#f2c811" stroke-opacity=".55"/>
        <text x="301" y="206" fill="#f7de6e">Power BI</text>
      </g>
    </g>
  </g>
</svg>
